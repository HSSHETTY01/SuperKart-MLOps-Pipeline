name: SuperKart End-to-End MLOps Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Ingest & Prepare Data
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          python src/data_prep.py

      - name: Step 2 - Train, Tune, & Evaluate Model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          python src/train.py

      - name: Step 3 - Commit Generated Splits & Model Artifacts to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/model.skops data/superkart_train.csv data/superkart_test.csv
          if git diff --staged --quiet; then
            echo "No artifact updates to commit."
          else
            git commit -m "Automated update: new model artifact & splits [skip ci]"
            git push origin main
          fi

      - name: Step 4 - Auto-Deploy to Hugging Face Streamlit Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          SPACE_NAME: SuperKart-Sales-Predictor
        run: |
          mkdir -p hf_sync
          cp src/app.py hf_sync/app.py
          cp artifacts/model.skops hf_sync/model.skops
          cp requirements.txt hf_sync/requirements.txt

          cat << 'EOF' > hf_sync/README.md
          ---
          title: SuperKart Demand Predictor
          emoji: 🛒
          colorFrom: blue
          colorTo: green
          sdk: streamlit
          app_file: app.py
          pinned: false
          ---
          EOF

          cd hf_sync
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add .
          git commit -m "Automated CI/CD deployment via GitHub Actions"
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME main
